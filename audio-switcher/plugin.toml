id           = "rael2pac/audio-switcher"
name         = "Audio Switcher"
version      = "1.1.0"
plugin_api   = 3
author       = "rael2pac"
license      = "MIT"
icon         = "peaker"
description  = "Roteia apps individualmente para saidas de audio diferentes"
tags         = ["Bar", "Panel", "Audio", "System", "Utility"]

[[service]]
id    = "audio-poller"
entry = "service.luau"

[[widget]]
id    = "bar"
entry = "widget.luau"

[[panel]]
id          = "panel"
entry       = "panel.luau"
width       = 500
height      = 400
placement   = "attached"
open_near_click = false

[[setting]]
key         = "refreshInterval"
type        = "int"
label_key   = "settings.refreshInterval.label"
description_key = "settings.refreshInterval.description"
default     = 3
min         = 1
max         = 15
